name: CI

# A release must never ship code the suite hasn't seen. For the automated path that
# is release.yml's job: it waits for this workflow's own run on main to go green
# before it tags anything. The `tags` trigger below covers the hand-pushed case —
# and only that case, because a tag release.yml pushes with GITHUB_TOKEN cannot
# start a workflow run at all.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # Pinned rather than installed from the manifest: the suite needs no runtime
      # dependencies, so there is no lockfile to install from.
      - name: Lint + format (Biome)
        run: npx --yes @biomejs/biome@2.5.5 ci .
      - name: Syntax check
        run: |
          for f in rules.js sw.js popup.js; do
            node --check "$f"
          done
      - name: Manifest is valid JSON
        run: node --input-type=module -e 'import fs from "node:fs"; JSON.parse(fs.readFileSync("manifest.json", "utf8"));'
      - name: Tests
        run: node --test
